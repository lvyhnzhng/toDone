version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: todone-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: todone
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - todone-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todone-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017
      - MONGODB_DB=todone
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
      - WS_PATH=/ws
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    networks:
      - todone-network
    volumes:
      - ./backend:/app
      - /app/vendor

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todone-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - todone-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  todone-network:
    driver: bridge 